# PostgreSQL for the POS.   Start:  docker compose up -d db      Stop:  docker compose stop db
# The data lives in the "pgdata" Docker volume, so it survives restarts and updates of this container.
# For a real store: change the password here AND in backend/.env (DATABASE_URL), then recreate the volume once.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POS_DB_PASSWORD:-pos}
      POSTGRES_DB: pos
      TZ: Asia/Karachi
    ports:
      - "127.0.0.1:5432:5432"      # reachable from this computer only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
